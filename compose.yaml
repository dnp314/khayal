services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: khayal
      POSTGRES_PASSWORD: khayal
      POSTGRES_DB: khayal
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied once, in filename order, when the volume is first created.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khayal -d khayal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: khayal:latest
    environment:
      DATABASE_URL: postgres://khayal:khayal@db:5432/khayal
      TZ: UTC
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
